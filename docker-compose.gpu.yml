# Vollstaendige Compose fuer die Intel-iGPU -- kein Override, kein -f-Geflecht.
#
# ACHTUNG, gemessen: auf einer UHD 630 war die GPU in JEDER Paarung langsamer
# als die CPU (large-v3-turbo 15,0s gegen 8,5s; small 3,7s gegen 2,5s). Eine
# iGPU teilt sich den Speicherbus mit der CPU, und genau daran haengt Whisper.
# Diese Datei bleibt fuer den Fall, dass eine kraeftigere iGPU das dreht --
# fuer den Normalbetrieb ist docker-compose.yml die richtige Wahl.
#
#   docker compose -f docker-compose.gpu.yml up -d
#   docker compose -f docker-compose.gpu.yml logs -f
#
# Braucht die .env daneben (wegen HERMES_KEY). Die drei Whisper-Werte darin
# werden hier ueberschrieben, environment sticht env_file.
services:
  bridge:
    image: ghcr.io/mavnezz/jarvis_hermes/bridge:latest-openvino
    container_name: jarvis-bridge
    restart: unless-stopped
    ports:
      - "8765:8765"
    env_file:
      - .env
    environment:
      # Intels vorkonvertiertes Modell -- kein optimum-cli-Export noetig.
      WHISPER_BACKEND: openvino
      WHISPER_DEVICE: GPU
      WHISPER_MODEL: OpenVINO/whisper-large-v3-turbo-int8-ov
    devices:
      # Nur der Render-Node, wie in der Jellyfin-Konfiguration auf derselben
      # NAS. Das ganze /dev/dri wuerde card0/card1 mitnehmen, die hier
      # niemand braucht.
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      # GIDs des HOSTS, nicht des Containers. Auf der UGREEN DXP4800 Plus:
      #   stat -c '%g %G' /dev/dri/renderD128   ->  105 render
      # Fuer reines Compute ueber den Render-Node reicht 105; 44 (video) ist
      # mitgenommen, weil dieselbe NAS Jellyfin damit betreibt und es
      # nichts kostet.
      # Stimmt die GID nicht, meldet OpenVINO keinen Fehler -- es sieht die
      # GPU schlicht nicht und rechnet still auf der CPU weiter.
      - "105"   # render
      - "44"    # video
    volumes:
      - voices:/voices
      - models:/root/.cache/huggingface

volumes:
  voices:
  models:
